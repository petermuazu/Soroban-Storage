[package]
name = "soroban-storage"
description = "Typed Soroban storage wrappers with explicit lifecycle (persistent / temporary / instance) and automatic TTL bumping"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["soroban", "stellar", "storage", "ttl", "smart-contracts"]
categories = ["no-std", "cryptography::cryptocurrencies"]
readme = "../../README.md"
documentation = "https://docs.rs/soroban-storage"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"

[features]
testutils = ["soroban-sdk/testutils"]

[package.metadata.docs.rs]
all-features = true
