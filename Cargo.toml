[workspace]
resolver = "2"
members = [
    "crates/soroban-storage",
    "examples/vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/soroban-dev-labs/Soroban-Storage"
rust-version = "1.91"

[workspace.dependencies]
soroban-sdk = "29.0.1"
soroban-storage = { path = "crates/soroban-storage" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
