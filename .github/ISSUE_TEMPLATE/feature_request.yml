name: Feature request
description: Suggest an improvement or new API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What storage or TTL problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      render: rust
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
