name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A key declaration and a test (ideally using `key.ttl(&env)`) that shows the problem.
      render: rust
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: soroban-storage, soroban-sdk, and network protocol version if relevant.
    validations:
      required: true
